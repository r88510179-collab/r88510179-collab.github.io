# Read-only score verification against the deployed public NFL score proxy.
# Pull request checks are deliberately bounded and use no secrets, login or database access.
# This does NOT prove independent official NFL scores or any write-path E2E acceptance.
name: Pool live score parity (read-only)

on:
  pull_request:
    paths:
      - 'nfl-pool/acceptance/**'
      - 'nfl-pool/score-proxy/index.mjs'
      - '.github/workflows/pool-live-score-parity.yml'
  workflow_dispatch:
    inputs:
      season:
        description: NFL season year (regular season)
        type: string
        required: true
        default: '2026'
      weeks:
        description: Week N or N-M (e.g. 1-9); adjust as the season progresses
        type: string
        required: true
        default: '1-9'

permissions:
  contents: read

jobs:
  deployed-score-parity:
    name: deployed-score-parity
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CHECK_SEASON: ${{ github.event.inputs.season || '2026' }}
      CHECK_WEEKS: ${{ github.event.inputs.weeks || '1-9' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Compare completed NFL games in ESPN with live nflscores2
        run: node nfl-pool/acceptance/score-reconcile.mjs --season "$CHECK_SEASON" --weeks "$CHECK_WEEKS"
